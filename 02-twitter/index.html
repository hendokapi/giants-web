<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Inserisci qui l'URL dell'immagine -->
    <link rel="icon" href="twitter.png" />

    <!-- Inserisci qui il titolo della pagina -->
    <title>Twitter</title>

    <!-- Il foglio di stile del sito web -->
    <link rel="stylesheet" href="style.css" />

    <!-- Il file JavaScript del sito web -->
    <script src="script.js" defer></script>
</head>

<body>
    <div class="container">
        <img src="twitter.png" class="twitter-logo">
        <h1>Twitter</h1>
        <form id="tweetForm">
            <label for="username">Il tuo username:</label>
            <input type="text" name="username" id="username" required>
            <label for="tweet">Cosa c'e' di nuovo?</label>
            <textarea name="tweet" id="tweet" required></textarea>
            <button type="submit">Tweet</button>
        </form>
        <div id="tweets"></div>
    </div>

    <footer class="footer">
    </footer>

</body>

</html>
